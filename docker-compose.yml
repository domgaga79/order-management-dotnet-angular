services:
  postgres:
    image: postgres:16-alpine
    container_name: order-management-postgres
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5432:5432"
    volumes:
      - order_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order_management_postgres_data:
